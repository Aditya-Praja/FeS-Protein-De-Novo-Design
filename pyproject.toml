[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fes-protein-de-novo-design"
version = "0.2.0"

description = "Computational de novo protein design for iron-sulfur cluster binding using RFdiffusion, ProteinMPNN, and structure prediction."

readme = "README.md"

requires-python = ">=3.9"

keywords = [
    "protein-design",
    "iron-sulfur-clusters",
    "computational-biology",
    "RFdiffusion",
    "ProteinMPNN",
    "structural-biology"
]

dependencies = [
    "numpy==2.0.2",
    "scipy==1.13.1",
    "PyYAML==6.0.3",
    "networkx==3.2.1",
    "matplotlib==3.9.4",
    "biopython==1.85",
]

[project.optional-dependencies]

dev = [
    "pytest>=7.0",
    "ruff>=0.9",
]

[project.scripts]
fes-wire = "fes_wire.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["fes_wire*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
